    "src/compute",
    "src/connector",
    "src/connector/codec",
    "src/connector/with_options",
    "src/ctl",
    "src/dml",
    "src/error",
    "src/expr/core",
    "src/expr/impl",
    "src/expr/macro",
    "src/frontend",
    "src/frontend/macro",
    "src/frontend/planner_test",
    "src/java_binding",
    "src/jni_core",
    "src/license",
    "src/meta",
    "src/meta/dashboard",
    "src/meta/model",
    "src/meta/model/migration",
    "src/meta/node",
    "src/meta/service",
    "src/object_store",
    "src/prost",
    "src/prost/helpers",
    "src/risedevtool",
    "src/risedevtool/config",
    "src/rpc_client",
    "src/sqlparser",
    "src/storage",
    "src/storage/backup",
    "src/storage/compactor",
    "src/storage/hummock_sdk",
    "src/storage/hummock_test",
    "src/stream",
    "src/stream/spill_test",
    "src/test_runner",
    "src/tests/compaction_test",
    "src/tests/e2e_extended_mode",
    "src/tests/mysql_test",
    "src/tests/regress",
    "src/tests/simulation",
    "src/tests/sqlsmith",
    "src/tests/state_cleaning_test",
    "src/utils/delta_btree_map",
    "src/utils/futures_util",
    "src/utils/iter_util",
    "src/utils/openai_embedding_service",
    "src/utils/pgwire",
    "src/utils/resource_util",
    "src/utils/runtime",
    "src/utils/sync-point",
    "src/utils/variables",
    "src/utils/workspace-config",
    "src/workspace-hack",
]
exclude = [
    "e2e_test/source_inline/pubsub",
    "e2e_test/udf/embedded_wasm",
    "lints",
]
resolver = "2"

[workspace.package]
version = "3.2.0-alpha"
edition = "2024"
homepage = "https://github.com/risingwavelabs/risingwave"
keywords = ["sql", "database", "streaming"]
license = "Apache-2.0"
repository = "https://github.com/risingwavelabs/risingwave"

# some dependencies are not worth deleting.
[workspace.metadata.cargo-machete]
ignored = [
    "workspace-hack",
    "expect-test",
    "pretty_assertions",
    "serde",
    "serde_json",
    "linkme",
    "tempfile",
    "cfg-if",
]
[workspace.metadata.cargo-udeps.ignore]
normal = ["workspace-hack"]
development = ["expect-test", "pretty_assertions"]

[workspace.metadata.dylint]
libraries = [{ path = "./lints" }]

