        (3, CAST(NULL AS VARIANT), 'three')
    AS t(id, v, s)""",
    """CREATE TABLE demo_db.test_variant_shredded (
        id INT,
        v VARIANT,
        s STRING
    ) USING iceberg
    TBLPROPERTIES ('format-version'='3')""",
]

