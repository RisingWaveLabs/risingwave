[package]
name = "risingwave_connector"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[package.metadata.cargo-machete]
ignored = []

[features]
default = []
test = []
all-sinks = [
    "sink-bigquery",
    "sink-deltalake",
    "sink-google_pubsub",
    "sink-clickhouse",
    "sink-doris",
    "sink-lancedb",
    "sink-starrocks",
]
all-sources = ["source-adbc_snowflake"]
source-adbc_snowflake = ["dep:adbc_core", "dep:adbc_snowflake"]
sink-bigquery = [
    "dep:gcp-bigquery-client",
    "dep:google-cloud-bigquery",
    "dep:google-cloud-googleapis",
]
sink-deltalake = ["dep:deltalake"]
sink-lancedb = ["dep:lancedb", "dep:lance", "dep:lance-table"]
# TODO: pubsub source is not feature-gated, thus `google-cloud-pubsub` cannot be optional.
sink-google_pubsub = ["dep:google-cloud-googleapis"]
sink-clickhouse = ["dep:clickhouse"]
sink-doris = []
sink-starrocks = []

[dependencies]
# Rust ADBC crates (e.g., adbc_core 0.23) are built against the ADBC C/C++ core driver library version 0.19
adbc_core = { workspace = true, optional = true }
adbc_snowflake = { workspace = true, optional = true, default-features = false }
anyhow = "1"
apache-avro = { workspace = true }
assert_matches = "1"
async-compression = { version = "0.4.5", features = ["gzip", "tokio"] }
async-nats = { version = "0.49", features = ["websockets"] }
async-trait = "0.1"
auto_enums = { workspace = true }
auto_impl = "1"
await-tree = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-msk-iam-sasl-signer = "1.0.1"
aws-sdk-dynamodb = { workspace = true }
aws-sdk-glue = { workspace = true }
aws-sdk-kinesis = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-smithy-types = { workspace = true }
aws-smithy-types-convert = { version = "0.60.1", features = ["convert-chrono"] }
aws-types = { workspace = true }
base64 = "0.23"
byteorder = "1"
bytes = { version = "1", features = ["serde"] }
cfg-if = "1"
cfg-or-panic = "0.2"
chrono = { workspace = true, features = ["clock", "std"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
clickhouse = { git = "https://github.com/risingwavelabs/clickhouse.rs", rev = "f05029d2cb65164d61fa8699dd955f808375a618", features = [
    "time",
    "rustls-tls",
], optional = true }
csv = "1.4"
deltalake = { workspace = true, optional = true }
duration-str = "0.18.0"
easy-ext = "1"
either = "1"
elasticsearch = { version = "8.17.0-alpha.1", features = ["rustls-tls"] }
enum-as-inner = "0.7"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-async-stream = { workspace = true }
gcp-bigquery-client = { version = "0.28.0", optional = true }
glob = "0.3"
google-cloud-bigquery = { package = "gcloud-bigquery", version = "1.6", features = [
    "auth",
], optional = true }
google-cloud-gax = { package = "gcloud-gax", version = "1" }
google-cloud-googleapis = { package = "gcloud-googleapis", version = "1", features = [
    "pubsub",
    "bigquery",
], optional = true }
google-cloud-pubsub = { package = "gcloud-pubsub", version = "1.5" }
iceberg = { workspace = true }
iceberg-catalog-glue = { workspace = true }
iceberg-catalog-rest = { workspace = true }
iceberg-storage-opendal = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
jni = { workspace = true }
lance = { workspace = true, optional = true }
lance-table = { workspace = true, optional = true }
lancedb = { workspace = true, optional = true }
maplit = "1.0.2"
moka = { version = "0.12.10", features = ["future"] }
mongodb = "3.5.1"
mysql_async = { workspace = true }
mysql_common = { version = "0.35", default-features = false, features = [
    "chrono",
] }
nexmark = { version = "0.2", features = ["serde"] }
num-bigint = "0.4"
opendal = { workspace = true, features = [
    "executors-tokio",
    "services-azblob",
    "services-fs",
    "services-gcs",
    "services-memory",
    "services-s3",
    "services-webhdfs",
] }
opensearch = { version = "2.3.0", features = ["rustls-tls"] }
openssl = { workspace = true }
parking_lot = { workspace = true }
parquet = { version = "58", features = ["async"] }
paste = "1"
pg_bigdecimal = { git = "https://github.com/risingwavelabs/rust-pg_bigdecimal", rev = "0b7893d88894ca082b4525f94f812da034486f7c" }
phf = { version = "0.13", features = ["macros"] }
postgres-openssl = "0.5.0"
prometheus = { version = "0.14", features = ["process"] }
prost = { workspace = true, features = ["no-recursion-limit"] }
prost-013 = { package = "prost", version = "0.13.4" }
prost-reflect = { workspace = true }
prost-types = { workspace = true }
pulsar = { version = "6.7", default-features = false, features = [
    "tokio-runtime",
    "auth-oauth2",
    "lz4",
    "zstd",
] }
rand = { workspace = true }
rdkafka = { workspace = true, features = [
    "cmake-build",
    "ssl",
    "gssapi",
    "zstd",
] }
redis = { workspace = true, features = [
    "aio",
    "tokio-comp",
    "tls-rustls",
    "tokio-rustls-comp",
    "cluster-async",
    "geospatial",
    "streams",
] }
regex = { workspace = true }
reqwest = { workspace = true }
risingwave_common = { workspace = true }
risingwave_common_estimate_size = { workspace = true }
risingwave_common_rate_limit = { workspace = true }
risingwave_connector_codec = { workspace = true }
risingwave_jni_core = { workspace = true }
risingwave_pb = { workspace = true }
risingwave_rpc_client = { workspace = true }
rumqttc = { version = "0.25.0", features = ["url"] }
rust_decimal = "1"
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
rw_futures_util = { workspace = true }
scopeguard = "1"
sea-orm = { workspace = true }
sea-schema = { version = "0.16", default-features = false, features = [
    "discovery",
    "sqlx-postgres",
    "sqlx-mysql",
] }
serde = { workspace = true, features = ["rc"] }
serde_json = "1"
serde_with = { version = "3", features = ["json"] }
simd-json = { version = "0.17.0", features = ["hints"] }
smallvec = { workspace = true }
sqlx = { workspace = true }
strum = "0.28"
strum_macros = "0.28"
tempfile = "3"
thiserror = { workspace = true }
thiserror-ext = { workspace = true }
# To easiy get the type_name and impl IntoSql for rust_decimal, we fork the crate.
# Another reason is that we are planning to refactor their IntoSql trait to allow specifying the type to convert.
tiberius = { git = "https://github.com/risingwavelabs/tiberius.git", rev = "cd69774fb1a4e08c0a3ea3b2041de7cc09662464", default-features = false, features = [
    "chrono",
    "sql-browser-tokio",
    "rustls",
    "rust_decimal",
    "bigdecimal",
    "tds73",
    "time",
] }
time = "0.3.47"
tokio = { workspace = true, features = ["fs"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
tokio-retry = "0.3"
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["codec", "io"] }
tonic = { workspace = true }
tracing = "0.1"
typed-builder = "^0.23"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7", "fast-rng"] }
with_options = { path = "./with_options" }
yup-oauth2 = "12.1.2"

[target.'cfg(not(madsim))'.dependencies]
workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
assert_matches = "1"
criterion = { workspace = true, features = ["async_tokio", "async"] }
deltalake = { workspace = true }
expect-test = "1"
fs-err = "3"
lance = { workspace = true }
lance-table = { workspace = true }
lancedb = { workspace = true }
paste = "1"
pretty_assertions = "1"
proc-macro2 = "1.0"
quote = "1"
rand = { workspace = true }
serde = { workspace = true }
serde_yaml = "0.9"
syn = { version = "2", features = ["full"] }
tempfile = "3"
tracing-subscriber = "0.3"
tracing-test = "0.2"
walkdir = "2"

[[bench]]
name = "debezium_json_parser"
harness = false

[[bench]]
name = "nexmark_integration"
harness = false

[[bench]]
name = "json_parser_case_insensitive"
harness = false

[[bench]]
name = "json_vs_plain_parser"
harness = false

[[bench]]
name = "protobuf_bench"
harness = false

[lints]
workspace = true
