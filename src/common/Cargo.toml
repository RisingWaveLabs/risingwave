[package]
name = "risingwave_common"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
ahash = "0.8"
allocator-api2 = "0.2"
anyhow = "1"
arc-swap = { workspace = true }
arrow-58-array = { package = "arrow-array", version = "58" }
arrow-58-buffer = { package = "arrow-buffer", version = "58" }
arrow-58-cast = { package = "arrow-cast", version = "58" }
arrow-58-schema = { package = "arrow-schema", version = "58" }
async-trait = "0.1"
auto_enums = { workspace = true }
auto_impl = "1"
bitfield-struct = "0.13"
bitflags = "2"
byteorder = "1"
bytes = "1"
chrono = { workspace = true, features = [
    "clock",
    "std",
] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
clap = { workspace = true }
comfy-table = "7"
crc32fast = "1"
easy-ext = "1"
educe = "0.6"
either = "1"
enum-as-inner = "0.7"
enumflags2 = { version = "0.7.8" }
ethnum = { version = "1", features = ["serde"] }
faiss = { workspace = true }
fixedbitset = "0.5"
foyer = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
hashbrown0_14 = { workspace = true }
hashbrown0_16 = { workspace = true }
hex = "0.4.3"
http = "1"
humantime = "2.3"
ipnet = "2.12"
itertools = { workspace = true }
itoa = "1.0"
jiff = "0.1.15"
jni = { workspace = true }
jsonbb = { workspace = true }
linkme = { workspace = true }
memcomparable = { version = "0.2", features = ["decimal"] }
num-integer = "0.1"
num-traits = "0.2"
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
parking_lot = { workspace = true }
parquet-variant = { workspace = true }
parquet-variant-compute = { workspace = true }
parquet-variant-json = { workspace = true }
parse-display = "0.11"
paste = "1"
pin-project-lite = { workspace = true }
postgres-types = { version = "0.2.6", features = [
    "derive",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
prometheus = { version = "0.14" }
prost = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.12.2", features = ["json"] }
risingwave-fields-derive = { path = "./fields-derive" }
risingwave_common_estimate_size = { workspace = true }
risingwave_common_log = { path = "./log" }
risingwave_common_metrics = { path = "./metrics" }
risingwave_common_proc_macro = { workspace = true }
risingwave_common_secret = { path = "./secret" }
risingwave_error = { workspace = true }
risingwave_license = { workspace = true }
risingwave_pb = { workspace = true }
risingwave_sqlparser = { workspace = true }
risingwave_telemetry_event = { workspace = true }
rust_decimal = { version = "1", features = ["db-postgres", "maths"] }
rw_iter_util = { workspace = true }
rw_resource_util = { workspace = true }
ryu = "1.0"
serde = { workspace = true }
serde-content = "0.1.2"
serde_bytes = "0.11"
serde_default = "0.2"
# serde_json 1.0.147 switched from ryu to zmij
# The former outputs `e` while the latter outputs `e+`
serde_json = ">= 1.0.145, < 1.0.147"
serde_with = "3"
smallbitset = "0.7.1"
smallvec = { workspace = true }
speedate = "0.15.0"
stacker = "0.1"
static_assertions = "1"
strum = "0.28"
strum_macros = "0.28"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = { workspace = true }
thiserror-ext = { workspace = true }
tinyvec = { version = "1", features = ["rustc_1_55", "grab_spare_slice"] }
tokio = { workspace = true }
tokio-retry = "0.3"
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = "0.1"
tracing-futures = { version = "0.2", features = ["futures-03"] }
tracing-opentelemetry = { workspace = true }
twox-hash = "2"
unit-prefix = "0.5.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(madsim))'.dependencies]
http-body = "1.0.1"
tower-layer = "0.3.3"
tower-service = "0.3.3"
workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
coarsetime = "0.1"
criterion = { workspace = true }
expect-test = "1"
lru = { workspace = true }
more-asserts = "0.3"
pretty_assertions = "1"
rand = { workspace = true }
rusty-fork = "0.3"
tempfile = "3"

[[bench]]
name = "bench_encoding"
harness = false

[[bench]]
name = "bitmap"
harness = false

[[bench]]
name = "bench_hash_key_encoding"
harness = false

[[bench]]
name = "bench_column_aware_row_encoding"
harness = false

[[bench]]
name = "bench_data_chunk_encoding"
harness = false

[[bench]]
name = "bench_data_chunk_compact"
harness = false

[[bench]]
name = "bench_array"
harness = false

[[bench]]
name = "bench_sequencer"
harness = false

[[bench]]
name = "bench_lru"
harness = false

[lints]
workspace = true
