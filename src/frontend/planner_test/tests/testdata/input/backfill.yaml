- name: "backfill order, no order, empty"
  sql: |
    create table t1(v1 int);
    select * from t1;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: "backfill order, auto, empty"
  sql: |
    create table t1(v1 int);
    select * from t1;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: "backfill order, auto, non-empty"
  sql: |
    create table t1(v1 int);
    create table t2(v2 int);
    select * from t1 join t2 on t1.v1 = t2.v2;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: "backfill order, fixed, non-empty"
  sql: |
    create table t1(v1 int);
    create table t2(v2 int);
    select * from t1 join t2 on t1.v1 = t2.v2;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: "backfill order, auto, bushy join"
  sql: |
    create table fact1(v1 int);
    create table fact2(v1 int);
    create table fact3(v1 int);
    create table fact4(v1 int);
    create table dim1(v1 int);
    create table dim2(v1 int);
    create table dim3(v1 int);
    create table dim4(v1 int);
    with
         joined1 as (select fact1.v1 from fact1 left join dim1 on fact1.v1 = dim1.v1),
         joined2 as (select fact2.v1 from fact2 left join dim2 on fact2.v1 = dim2.v1),
         joined3 as (select fact3.v1 from fact3 left join dim3 on fact3.v1 = dim3.v1),
         joined4 as (select fact4.v1 from fact4 left join dim4 on fact4.v1 = dim4.v1),
         joined12 as (select joined1.v1 from joined1 left join joined2 on joined1.v1 = joined2.v1),
         joined34 as (select joined3.v1 from joined3 left join joined4 on joined3.v1 = joined4.v1),
         joined1234 as (select joined12.v1 from joined12 left join joined34 on joined12.v1 = joined34.v1)
    select * from joined1234;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: backfill order, auto, union, empty
  sql: |
    create table t1(v1 int);
    create table t2(v2 int);
    select * from (select * from t1 union all select * from t2);
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: backfill order, auto, union with join, non-empty
  sql: |
    create table fact1(v1 int);
    create table fact2(v1 int);
    create table fact3(v1 int);
    create table fact4(v1 int);
    create table dim1(v1 int);
    create table dim2(v1 int);
    create table dim3(v1 int);
    create table dim4(v1 int);
    with
         joined1 as (select fact1.v1 from fact1 left join dim1 on fact1.v1 = dim1.v1),
         joined2 as (select fact2.v1 from fact2 left join dim2 on fact2.v1 = dim2.v1),
         joined3 as (select fact3.v1 from fact3 left join dim3 on fact3.v1 = dim3.v1),
         joined4 as (select fact4.v1 from fact4 left join dim4 on fact4.v1 = dim4.v1),
         union12 as (select joined1.v1 from joined1 union all select joined2.v1 from joined2),
         union34 as (select joined3.v1 from joined3 union all select joined4.v1 from joined4),
         joined1234 as (select union12.v1 from union12 left join union34 on union12.v1 = union34.v1)
    select * from joined1234;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
- name: backfill order, auto, union with join, test explain
  sql: |
    create table fact1(v1 int);
    create table fact2(v1 int);
    create table fact3(v1 int);
    create table fact4(v1 int);
    create table dim1(v1 int);
    create table dim2(v1 int);
    create table dim3(v1 int);
    create table dim4(v1 int);
    explain(backfill, format dot) create materialized view m1 with (backfill_order = auto)
    as with
         joined1 as (select fact1.v1 from fact1 left join dim1 on fact1.v1 = dim1.v1),
         joined2 as (select fact2.v1 from fact2 left join dim2 on fact2.v1 = dim2.v1),
         joined3 as (select fact3.v1 from fact3 left join dim3 on fact3.v1 = dim3.v1),
         joined4 as (select fact4.v1 from fact4 left join dim4 on fact4.v1 = dim4.v1),
         union12 as (select joined1.v1 from joined1 union all select joined2.v1 from joined2),
         union34 as (select joined3.v1 from joined3 union all select joined4.v1 from joined4),
         joined1234 as (select union12.v1 from union12 left join union34 on union12.v1 = union34.v1)
    select * from joined1234;
  expected_outputs:
    - explain_output
- name: snapshot backfill prefix equality pushdown
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a = 1 and b = 2;
  expected_outputs:
    - stream_plan
- name: deprecated arrangement backfill switch is ignored
  sql: |
    set streaming_use_snapshot_backfill = false;
    set streaming_use_arrangement_backfill = false;
    create table t(a int, b int, primary key(a));
    select * from t;
  expected_outputs:
    - stream_plan
- name: deprecated arrangement backfill switch is ignored for index
  sql: |
    set streaming_use_snapshot_backfill = false;
    set streaming_use_arrangement_backfill = false;
    create table t(a int, b int, primary key(a));
    explain (distsql, verbose) create index idx_b on t(b);
  expected_outputs:
    - explain_output
- name: deprecated arrangement backfill switch is ignored for sink
  sql: |
    set streaming_use_snapshot_backfill = false;
    set streaming_use_arrangement_backfill = false;
    create table t(a int, b int, primary key(a));
    explain (distsql, verbose) create sink s as select * from t with (connector='blackhole');
  expected_outputs:
    - explain_output
- name: snapshot backfill skips non-prefix equality
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where b = 2;
  expected_outputs:
    - stream_plan
- name: snapshot backfill skips residual-on-top-of-prefix
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a = 1 and c = 3;
  expected_outputs:
    - stream_plan
- name: snapshot backfill range filter on pk
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a >= 10 and a <= 20;
  expected_outputs:
    - stream_plan
- name: snapshot backfill prefix eq plus range
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a = 1 and b >= 10 and b <= 20;
  expected_outputs:
    - stream_plan
- name: snapshot backfill prefix eq plus one-sided range
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a = 1 and b > 5;
  expected_outputs:
    - stream_plan
- name: snapshot backfill scan range rejects invalid now predicate
  sql: |
    create table t(a int, ts timestamp with time zone, primary key(a));
    select * from t where a = 1 and (ts >= now() or ts <= now());
  expected_outputs:
    - stream_error
- name: snapshot backfill IN predicate produces UNION of scans
  sql: |
    create table t(a int, b int, c int, primary key(a, b));
    select * from t where a IN (1, 3, 5);
  expected_outputs:
    - stream_plan
- name: snapshot backfill covering index selection
  sql: |
    create table t(a int, b int, c int, primary key(a));
    create index idx_b on t(b) include(a, c);
    select * from t where b = 1;
  expected_outputs:
    - stream_plan
- name: snapshot backfill covering index with IN predicate
  sql: |
    create table t(a int, b int, c int, primary key(a));
    create index idx_b on t(b) include(a, c);
    select * from t where b IN (1, 2, 3);
  expected_outputs:
    - stream_plan
- name: snapshot backfill index selection without explicit include
  sql: |
    create table t(a int, b int, c int, primary key(a));
    create index idx_b on t(b);
    select * from t where b = 1;
  expected_outputs:
    - stream_plan
- name: fixed backfill order with selected index
  sql: |
    set enable_index_selection = true;
    create table fact(v1 int);
    create table dim(v1 int, v2 int);
    create index idx_dim_v1 on dim(v1);
    explain (backfill, format dot) create materialized view mv
    with (backfill_order = FIXED(fact -> dim))
    as
      select count(*)
      from fact join dim on fact.v1 = dim.v1
      group by fact.v1;
  expected_outputs:
    - explain_output
- name: |
    Test backfill order, auto, stream share cycle.
    For auto derived backfill order with cycle, it should not return any order plan, and return a NOTICE
    to the user.
  sql: |
    create table fact1(v1 int);
    create table fact2(v1 int);
    create table fact3(v1 int);
    create table fact4(v1 int);
    create table dim1(v1 int);
    create table dim2(v1 int);
    create table dim3(v1 int);
    create table dim4(v1 int);
    with
        joined1 as (select fact1.v1 from fact1 left join dim1 on fact1.v1 = dim1.v1),
        joined2 as (select fact2.v1 from fact2 left join dim2 on fact2.v1 = dim2.v1),
        joined3 as (select fact3.v1 from fact3 left join dim3 on fact3.v1 = dim3.v1),
        joined12 as (select joined1.v1 from joined1 left join joined2 on joined1.v1 = joined2.v1),
        joined13 as (select joined1.v1 from joined1 left join joined3 on joined1.v1 = joined3.v1),
        joined1213 as (select joined12.v1 from joined12 left join joined13 on joined12.v1 = joined13.v1)
    select * from joined1213;
  expected_outputs:
    - stream_plan
    - backfill_order_plan
