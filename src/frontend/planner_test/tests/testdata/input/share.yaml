- id: create_sources
  sql: |
    create source auction (id BIGINT, "item_name" VARCHAR, description VARCHAR, "initial_bid" BIGINT, reserve BIGINT, "date_time" TIMESTAMP, expires TIMESTAMP, seller BIGINT, category BIGINT, "extra" VARCHAR)
    with (
    connector = 'nexmark',
    nexmark.table.type = 'Auction',
    nexmark.split.num = '4',
    nexmark.min.event.gap.in.ns = '1000'
    );
    create source bid (auction BIGINT, bidder BIGINT, price BIGINT, "channel" VARCHAR, "url" VARCHAR, "date_time" TIMESTAMP, "extra" VARCHAR)
    with (
    connector = 'nexmark',
    nexmark.table.type = 'Bid',
    nexmark.split.num = '4',
    nexmark.min.event.gap.in.ns = '1000'
    );
    create table table_for_fixed_now_timestamp;
  expected_outputs: []
- id: self_join
  before:
  - create_sources
  sql: |
    select count(*) cnt from auction A join auction B on A.id = B.id where A.initial_bid = 1 and B.initial_bid = 2;
  expected_outputs:
  - batch_plan
  - stream_plan
- id: nexmark_q5
  before:
  - create_sources
  sql: |
    SELECT AuctionBids.auction, AuctionBids.num FROM (
      SELECT
        bid.auction,
        count(*) AS num,
        window_start AS starttime
      FROM
        HOP(bid, date_time, INTERVAL '2' SECOND, INTERVAL '10' SECOND)
      GROUP BY
        window_start,
        bid.auction
    ) AS AuctionBids
    JOIN (
      SELECT
        max(CountBids.num) AS maxn,
        CountBids.starttime_c
      FROM (
        SELECT
          count(*) AS num,
          window_start AS starttime_c
        FROM HOP(bid, date_time, INTERVAL '2' SECOND, INTERVAL '10' SECOND)
        GROUP BY
          bid.auction,
          window_start
      ) AS CountBids
      GROUP BY
        CountBids.starttime_c
    ) AS MaxBids
    ON AuctionBids.starttime = MaxBids.starttime_c AND AuctionBids.num >= MaxBids.maxn;
  expected_outputs:
  - stream_plan
  - logical_plan
  - batch_plan
- sql: |
    set enable_share_plan=true;
    create table t(a int, b int);
    with cte as (select count(*) from t) select * from cte union all select * from cte;
  expected_outputs:
  - stream_plan
- sql: |
    set enable_share_plan=false;
    create table t(a int, b int);
    with cte as (select count(*) from t) select * from cte union all select * from cte;
  expected_outputs:
  - stream_plan
- id: force_share_source_for_self_join
  before:
  - create_sources
  sql: |
    set enable_share_plan=false;
    select count(*) cnt from auction A join auction B on A.id = B.id;
  expected_outputs:
  - stream_plan
- id: self_join_multiple_edges
  sql: |
    create table t (a int, b int);
    with cte as (select a, sum(b) sum from t group by a) select count(*) from cte c1 join cte c2 on c1.a = c2.a;
  expected_outputs:
  - stream_plan
  - stream_dist_plan
- id: self_join_with_temporal_filter_one_side
  before:
  - create_sources
  sql: |
    select A.id as a_id, B.id as b_id, A.date_time as A_ts, B.date_time as B_ts from auction A join auction B on A.id = B.id where A.initial_bid = 1 and B.initial_bid = 2 and A.date_time > now() - INTERVAL '1' SECOND;
  expected_outputs:
  - batch_plan
  - stream_plan
- id: predicate_pushdown_blocked_by_over_window
  sql: |
    create table t (a int, b int, c int);
    with cte as (select a, b from t where c > 0)
    select x.a, x.r1, x.r2, y.b
    from (
      select a,
             rank() over (partition by a order by b) as r1,
             rank() over (partition by b order by a) as r2
      from cte
    ) x
    join cte y on x.a = y.a;
  expected_outputs:
  - stream_plan
- id: column_pruning_with_different_parent_column_subsets
  sql: |
    create table t (a int, b int, c int, d int);
    with cte as (select a, b, c, d from t where a > 0)
    select cte1.a, cte1.b, cte2.c from cte cte1 join cte cte2 on cte1.a = cte2.a;
  expected_outputs:
  - stream_plan
- id: nested_multi_parent_share
  sql: |
    create table t (a int, b int, c int);
    with cte1 as (select a, b from t where c > 0),
         cte2 as (select c1.a, c2.b from cte1 c1 join cte1 c2 on c1.a = c2.a)
    select x.a, y.b from cte2 x join cte2 y on x.a = y.a;
  expected_outputs:
  - stream_plan
