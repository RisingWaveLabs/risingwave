- name: jsonb in group by
  sql: |
    create table t1 (v1 jsonb, v2 int);
    create table t2 (v3 jsonb, v4 int);
    select v2 from t1 group by v2, v1;
  expected_outputs:
  - stream_error
- name: jsonb in union
  sql: |
    create table t1 (v1 jsonb, v2 int);
    create table t2 (v3 jsonb, v4 int);
    select v1, v2 from t1 union select v3, v4 from t2;
  expected_outputs:
  - stream_error
- name: jsonb in distinct
  sql: |
    create table t1 (v1 jsonb, v2 int);
    select distinct v1 from t1;
  expected_outputs:
  - stream_error
- name: jsonb in TopN by group
  sql: |
    create table t1 (v1 jsonb, v2 int);
    SELECT v1 FROM (
      SELECT v1, rank() OVER (PARTITION BY v1 ORDER BY v2) AS rank
      FROM t1)
    WHERE rank <= 2;
  expected_outputs:
  - stream_error
- name: variant in group by with jsonb opt-in
  sql: |
    set rw_streaming_allow_jsonb_in_stream_key = true;
    create table t1 (v1 variant, v2 int);
    select v2 from t1 group by v2, v1;
  expected_outputs:
  - stream_error
- name: variant in materialized view order by
  sql: |
    create table t1 (v1 variant, v2 int);
    select v1, v2 from t1 order by v1;
  expected_outputs:
  - stream_error
- name: nested variant in TopN order key
  sql: |
    create table t1 (id int primary key, s struct<v variant>);
    select count(*) from (select * from t1 order by s limit 10);
  expected_outputs:
  - stream_error
- name: nested variant in join key
  sql: |
    create table t1 (id int primary key, s struct<v variant>);
    create table t2 (id int primary key, s struct<v variant>);
    select t1.id from t1 join t2 on t1.s = t2.s;
  expected_outputs:
  - batch_error
  - stream_error
- name: nested variant in over window partition key
  sql: |
    create table t1 (id int primary key, s struct<v variant>);
    select id from (
      select id, rank() OVER (PARTITION BY s ORDER BY id) AS rank
      from t1)
    where rank <= 2;
  expected_outputs:
  - stream_error
