- name: dedup provides locality on its dedup columns, so no extra locality provider is needed for the downstream agg.
  sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t(a int, b int, c int) append only;
    select count(*) from (select distinct on(a, b) * from t) group by a;
  expected_outputs:
    - stream_plan
- sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t(a int, b int, c int);
    SELECT * FROM (
    SELECT
        *,
        row_number() OVER (PARTITION BY a ORDER BY b) AS rank
        FROM t
    ) WHERE rank <= 1;
  expected_outputs:
    - stream_plan
- sql: |
    set enable_locality_backfill = true;
    set locality_backfill_mode = always;
    create table t(a int, b int, c int);
    SELECT
      row_number() OVER (PARTITION BY b ORDER BY a) AS rank2
    FROM (
      SELECT * FROM (
        SELECT
            *,
            row_number() OVER (PARTITION BY a, b ORDER BY c) AS rank1
        FROM t
      ) WHERE rank1 <= 1
    );
  expected_outputs:
    - stream_plan
