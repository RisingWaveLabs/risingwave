- name: MATCH_RECOGNIZE plans end-to-end to a WatermarkSort plus MatchRecognize pipeline
  sql: |
    create table t(id int, ts int, v int, watermark for ts as ts - 10) append only;
    select * from t match_recognize (
      partition by id
      order by ts
      measures b.v as dip
      one row per match
      after match skip past last row
      pattern (a b)
      define a as a.v > 0, b as b.v < 0
    );
  expected_outputs:
    - logical_plan
    - stream_plan
- name: MATCH_RECOGNIZE predicate pushdown visits every shared CTE parent
  sql: |
    create table t(id int, ts int, v int, watermark for ts as ts - 10) append only;
    with cte as (select * from t)
    select * from cte match_recognize (
      partition by id
      order by ts
      measures a.v as value
      one row per match
      after match skip past last row
      pattern (a)
      define a as a.v > 0
    )
    union all
    select id, v from cte;
  expected_outputs:
    - logical_plan
