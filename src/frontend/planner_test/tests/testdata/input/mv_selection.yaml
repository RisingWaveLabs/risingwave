- id: inner_join_selection
  sql: |
    create table depts (deptno int, deptname varchar);
    create table emps (empid int, deptno int, empname varchar);
    create materialized view mv_join as
      select empid
      from emps
      join depts using (deptno);
    set enable_mv_selection = true;
    select empid
    from depts
    join (
      select empid, deptno
      from emps
      where empid = 1
    ) as subq
    on depts.deptno = subq.deptno;
  expected_outputs:
  - batch_plan
- id: multi_inner_join_selection
  sql: |
    create table t1_multi (a int, b int);
    create table t2_multi (b int, c int);
    create table t3_multi (c int, d int);
    create materialized view mv_multi_join as
      select a
      from t1_multi
      join t2_multi using (b)
      join t3_multi using (c);
    set enable_mv_selection = true;
    select a
    from t3_multi
    join t2_multi using (c)
    join (
      select a, b
      from t1_multi
      where a = 1
    ) as subq
    using (b);
  expected_outputs:
  - batch_plan
- id: inner_join_self_join_selection
  sql: |
    create table t_self (a int, b int);
    create materialized view mv_self_join as
      select l.a
      from t_self as l
      join t_self as r
      on l.b = r.b;
    set enable_mv_selection = true;
    select l.a
    from t_self as r
    join (
      select a, b
      from t_self
      where a = 1
    ) as l
    on r.b = l.b;
  expected_outputs:
  - batch_plan
- id: mv_with_cte_single_reference
  sql: |
    create table t_cte (a int, b int, c int);
    create materialized view mv_cte as with cte as (select a, b from t_cte where c > 0) select a, sum(b) as s from cte group by a;
    set enable_mv_selection = true;
    with cte as (select a, b from t_cte where c > 0) select a, sum(b) as s from cte group by a;
  expected_outputs:
  - batch_plan
- id: mv_with_cte_multiple_references
  sql: |
    create table t_cte2 (a int, b int, c int);
    create materialized view mv_cte2 as with cte as (select a, b from t_cte2 where c > 0) select c1.a, sum(c2.b) as s from cte c1 join cte c2 on c1.a = c2.a group by c1.a;
    set enable_mv_selection = true;
    with cte as (select a, b from t_cte2 where c > 0) select c1.a, sum(c2.b) as s from cte c1 join cte c2 on c1.a = c2.a group by c1.a;
  expected_outputs:
  - batch_plan
