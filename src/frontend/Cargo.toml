[package]
name = "risingwave_frontend"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
default = []
datafusion = ["dep:datafusion", "dep:datafusion-common"]
datafusion-backtrace = ["datafusion", "datafusion/backtrace", "datafusion-common/backtrace"]
all-sources = ["source-adbc_snowflake"]
source-adbc_snowflake = ["risingwave_connector/source-adbc_snowflake"]

[dependencies]
anyhow = "1"
arc-swap = { workspace = true }
async-recursion = "1.1.0"
async-trait = "0.1"
auto_enums = { workspace = true }
auto_impl = "1"
axum = { workspace = true }
axum-server = { version = "0.8", features = ["tls-openssl"] }
base64 = "0.23"
bk-tree = "0.5.0"
bytes = "1"
chrono = { workspace = true }
clap = { workspace = true }
datafusion = { version = "53", optional = true, features = [
    "nested_expressions",
] }
datafusion-common = { version = "53", optional = true }
downcast-rs = "2.0"
dyn-clone = "1.0.14"
easy-ext = "1"
educe = "0.6"
either = "1"
enum-as-inner = "0.7"
fancy-regex = "0.17.0"
fixedbitset = "0.5"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-async-stream = { workspace = true }
iana-time-zone = "0.1"
iceberg = { workspace = true }
itertools = { workspace = true }
jsonbb = { workspace = true }
linkme = { workspace = true }
maplit = "1"
md5 = { package = "md-5", version = "0.10.6" }
memcomparable = "0.2"
mysql_async = { workspace = true }
mysql_common = { version = "0.38", default-features = false, features = [
    "chrono",
] }
num-integer = "0.1"
parking_lot = { workspace = true }
parse-display = "0.11"
paste = "1"
percent-encoding = "2.3.1"
petgraph = "0.8"
pgwire = { path = "../utils/pgwire" }
pin-project-lite = { workspace = true }
postgres-types = { version = "0.2.6" }
pretty-xmlish = "0.1.13"
pretty_assertions = "1"
prometheus = { version = "0.14", features = ["process"] }
prometheus-http-query = "0.8.3"
prost = { workspace = true }
quick-xml = { version = "0.40", features = ["serialize"] }
rand = { version = "0.9", features = ["small_rng"] }
risingwave_batch = { workspace = true }
risingwave_common = { workspace = true }
risingwave_common_estimate_size = { workspace = true }
risingwave_common_heap_profiling = { workspace = true }
risingwave_common_service = { workspace = true }
risingwave_connector = { workspace = true }
risingwave_dml = { workspace = true }
risingwave_expr = { workspace = true }
risingwave_frontend_macro = { path = "macro" }
risingwave_hummock_sdk = { workspace = true }
risingwave_pb = { workspace = true }
risingwave_rpc_client = { workspace = true }
risingwave_sqlparser = { workspace = true }
risingwave_storage = { workspace = true }
risingwave_variables = { workspace = true }
rw_futures_util = { workspace = true }
scopeguard = "1.2.0"
serde = { workspace = true }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.10.7"
smallvec = { workspace = true, features = ["serde"] }
speedate = "0.15.0"
static_assertions = "1"
tempfile = "3"
thiserror = { workspace = true }
thiserror-ext = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-postgres = "0.7"
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tower = { version = "0.5", features = ["util", "load-shed"] }
tower-http = { version = "0.6", features = [
    "add-extension",
    "cors",
    "compression-gzip",
] }
tracing = "0.1"
url = "2.5.0"
uuid = "1"

[target.'cfg(not(madsim))'.dependencies]
workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
assert_matches = "1"
expect-test = "1"
risingwave_batch_executors = { workspace = true }
risingwave_expr_impl = { workspace = true }
tempfile = "3"

[lints]
workspace = true
