[package]
name = "risingwave_stream"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
dhat-heap = ["dhat"]
test = []
all-sources = ["source-adbc_snowflake"]
source-adbc_snowflake = ["risingwave_connector/source-adbc_snowflake"]

[dependencies]
anyhow = "1"
async-recursion = "1"
async-stream = "0.3"
async-trait = "0.1"
auto_enums = { workspace = true }
await-tree = { workspace = true }
bytes = "1"
cfg-if = "1"
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
delta_btree_map = { path = "../utils/delta_btree_map" }
dhat = { version = "0.3", optional = true }
educe = "0.6"
either = "1"
enum-as-inner = "0.7"
fail = "0.5"
foyer = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-async-stream = { workspace = true }
glob = "0.3"
hashbrown = { workspace = true }
hytra = "0.1.2"
iceberg = { workspace = true }
indexmap = "2"
itertools = { workspace = true }
jsonbb = { workspace = true }
maplit = "1.0.2"
memcomparable = "0.2"
moka = { version = "0.12.0", features = ["sync"] }
multimap = "0.10"
parking_lot = { workspace = true }
parquet = { workspace = true }
paste = "1"
pin-project = "1"
prometheus = { version = "0.14", features = ["process"] }
prost = { workspace = true }
rand = { workspace = true }
risingwave_common = { workspace = true }
risingwave_common_estimate_size = { workspace = true }
risingwave_common_rate_limit = { workspace = true }
risingwave_connector = { workspace = true }
risingwave_dml = { workspace = true }
risingwave_expr = { workspace = true }
risingwave_hummock_sdk = { workspace = true }
risingwave_pb = { workspace = true }
risingwave_rpc_client = { workspace = true }
risingwave_storage = { workspace = true }
rw_futures_util = { workspace = true }
serde = { workspace = true }
serde_json = "1"
smallvec = { workspace = true }
static_assertions = "1"
strum_macros = "0.28"
thiserror = { workspace = true }
thiserror-ext = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-metrics = "0.5.1"
tokio-retry = "0.3"
tokio-stream = { workspace = true }
tonic = { workspace = true }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "fast-rng"] }

[target.'cfg(not(madsim))'.dependencies]
workspace-hack = { path = "../workspace-hack" }

[dev-dependencies]
assert_matches = "1"
criterion = { workspace = true, features = ["async_tokio", "async"] }
expect-test = "1"
pretty_assertions = "1"
risingwave_connector = { workspace = true, features = ["test"] }
risingwave_expr_impl = { workspace = true }
risingwave_hummock_sdk = { workspace = true }
risingwave_hummock_test = { path = "../storage/hummock_test", features = [
    "test",
] }
risingwave_stream = { workspace = true, features = ["test"] }
serde_yaml = "0.9"
tracing-subscriber = "0.3.20"
tracing-test = "0.2"

[[bench]]
name = "stream_hash_agg"
harness = false

[[bench]]
name = "bench_state_table"
harness = false

[[bench]]
name = "stream_hash_join_rt"
harness = false

[[bench]]
name = "stream_hash_join_mem"
harness = false

[lints]
workspace = true
