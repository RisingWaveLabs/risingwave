name: Typo checker

permissions:
  contents: read

on: [pull_request]

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v5

    - name: Check spelling of the entire repository
      uses: crate-ci/typos@v1.38.1
