name: Label PRs

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    name: pr-labeler
    steps:
    - uses: srvaroa/labeler@master
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
