name: Assign milestone

permissions:
  issues: write

on:
  issues:
    types: [opened]

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    steps:
    - name: Add issue to the latest milestone
      uses: fuyufjh/automatically-set-milestone-to-issue@v0.2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        version-prefix: 'release-'
        version-separator: '.'
        overwrite: false
