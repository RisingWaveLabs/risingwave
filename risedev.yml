# The schema for RiseDev configuration files is defined under `src/risedevtool/schemas`.
#
# You can add the following section to `.vscode/settings.json` to get hover support in VS Code:
#
# ```
#     "yaml.schemas": {
#         "src/risedevtool/schemas/risedev.json": "risedev.yml",
#         "src/risedevtool/schemas/risedev-profiles.user.json": "risedev-profiles.user.yml"
#     }
# ```

profile:
  #################################################
  ### Configuration profiles used by developers ###
  #################################################

  # The default configuration will start 1 compute node, 1 meta node and 1 frontend.
  default:
    # # Specify a configuration file to override the default settings
    # config-path: src/config/example.toml
    # # Specify custom environment variables
    # env:
    #   RUST_LOG: "info,risingwave_storage::hummock=off"
    #   ENABLE_PRETTY_LOG: "true"
    steps:
      # If you want to use the local s3 storage, enable the following line
      # - use: minio

      # If you want to use aws-s3, configure AK and SK in env var and enable the following lines:
      # - use: aws-s3
      #   bucket: test-bucket

      # By default, the meta-backend is memory.
      # To enable sqlite backend, uncomment the following lines and set the meta-backend to sqlite in 'meta-node'
      # - use: sqlite
      # To enable postgres backend, uncomment the following lines and set the meta-backend to postgres in 'meta-node'
      # - use: postgres
      #   port: 8432
      #   user: postgres
      #   database: metadata

      # If you want to enable metrics or tracing, uncomment the following lines.
      # - use: prometheus  # metrics
      # - use: tempo       # tracing
      # - use: grafana     # visualization

      - use: meta-node
        # meta-backend: postgres
      - use: compute-node
      - use: frontend

      # If you want to enable compactor, uncomment the following line, and enable either minio or aws-s3 as well.
      # - use: compactor

      # If you want to create source from Kafka, uncomment the following lines
      # - use: kafka
      #   persist-data: true

      # To enable Confluent schema registry, uncomment the following line
      # - use: schema-registry

  default-v6:
    steps:
      - use: meta-node
        address: "[::1]"
        listen-address: "[::]"
      - use: compute-node
        address: "[::1]"
        listen-address: "[::]"
      - use: frontend
        address: "[::1]"
        listen-address: "[::]"

  # The minimum config to use with risectl.
  for-ctl:
    steps:
      - use: minio
      - use: meta-node
      - use: compute-node
      - use: frontend
      - use: compactor

  # `dev-compute-node` have the same settings as default except the compute node will be started by user.
  dev-compute-node:
    steps:
      - use: meta-node
      - use: compute-node
        user-managed: true
      - use: frontend

  dev-frontend:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
        user-managed: true

  dev-meta:
    steps:
      - use: meta-node
        user-managed: true
      - use: compute-node
      - use: frontend

  # You can use this in combination with the virtual compactor
  # provided in https://github.com/risingwavelabs/risingwave-extensions
  dev-compactor:
    steps:
      - use: minio
      - use: meta-node
      - use: compute-node
      - use: frontend
      - use: compactor
        user-managed: true

  full:
    steps:
      - use: minio
      - use: postgres
        port: 8432
        user: postgres
        password: postgres
        database: metadata
      - use: meta-node
        meta-backend: postgres
      - use: compute-node
      - use: frontend
      - use: compactor
      - use: compactor
        compactor-mode: "dedicated-iceberg"
        port: 6661
        exporter-port: 1261
      - use: prometheus
      - use: grafana
      - use: kafka
        persist-data: true
      - use: lakekeeper
        port: 8181

  standalone-full-peripherals:
    steps:
      - use: minio
      - use: postgres
        port: 8432
        user: postgres
        database: metadata
      - use: meta-node
        user-managed: true
        meta-backend: postgres
      - use: compute-node
        user-managed: true
      - use: frontend
        user-managed: true
      - use: compactor
        user-managed: true
      - use: prometheus
      - use: grafana
      - use: kafka
        persist-data: true

  standalone-minio-sqlite:
    steps:
      - use: minio
      - use: sqlite
      - use: meta-node
        user-managed: true
        meta-backend: sqlite
      - use: compute-node
        user-managed: true
      - use: frontend
        user-managed: true
      - use: compactor
        user-managed: true

  standalone-minio-sqlite-compactor:
    steps:
      - use: minio
      - use: sqlite
      - use: meta-node
        user-managed: true
        meta-backend: sqlite
      - use: compute-node
        user-managed: true
      - use: frontend
        user-managed: true
      - use: compactor

  hdfs:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      # If you want to use hdfs as storage backend, configure hdfs namenode:
      - use: opendal
        engine: hdfs
        namenode: "127.0.0.1:9000"
      - use: compactor
      # - use: prometheus
      # - use: grafana
  fs:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      - use: opendal
        engine: fs
      - use: compactor
      # - use: prometheus
      # - use: grafana
  webhdfs:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      # If you want to use webhdfs as storage backend, configure hdfs namenode:
      - use: opendal
        engine: webhdfs
        namenode: "127.0.0.1:9870"
      - use: compactor
      # - use: prometheus
      # - use: grafana

  gcs:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      # If you want to use google cloud storage as storage backend, configure bucket name:
      - use: opendal
        engine: gcs
        bucket: bucket-name
      - use: compactor
      # - use: prometheus
      # - use: grafana
  obs:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      # If you want to use obs as storage backend, configure bucket name:
      - use: opendal
        engine: obs
        bucket: bucket-name
      - use: compactor
      # - use: prometheus
      # - use: grafana

  oss:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      # If you want to use oss as storage backend, configure bucket name:
      - use: opendal
        engine: oss
        bucket: bucket-name
      - use: compactor
      # - use: prometheus
      # - use: grafana

  azblob:
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend
      # If you want to use azblob as storage backend, configure bucket(container) name:
      - use: opendal
        engine: azblob
        bucket: test-bucket
      - use: compactor
      # - use: prometheus
      # - use: grafana

  full-benchmark:
    steps:
      - use: minio
      - use: postgres
      - use: meta-node
        meta-backend: postgres
      - use: compute-node
      - use: frontend
      - use: compactor
      - use: prometheus
        remote-write: true
        remote-write-region: "ap-southeast-1"
        remote-write-url: "https://aps-workspaces.ap-southeast-1.amazonaws.com/workspaces/ws-f3841dad-6a5c-420f-8f62-8f66487f512a/api/v1/remote_write"
      - use: grafana
      - use: kafka
        persist-data: true

  kafka:
    steps:
      - use: kafka

  meta-1cn-1fe-sqlite:
    steps:
      - use: minio
      - use: sqlite
      - use: meta-node
        port: 5690
        dashboard-port: 5691
        exporter-port: 1250
        meta-backend: sqlite
      - use: compactor
      - use: compute-node
      - use: frontend

  # Start 4 CNs with resource groups rg1, rg2, and default
  multiple-resource-groups:
    steps:
      - use: minio
      - use: meta-node
      - use: compactor
      - use: compute-node
        port: 5687
        exporter-port: 1222
        enable-tiered-cache: true
        resource-group: "rg1"
      - use: compute-node
        port: 5688
        exporter-port: 1223
        resource-group: "rg2"
        enable-tiered-cache: true
      - use: compute-node
        port: 5689
        exporter-port: 1224
        enable-tiered-cache: true
      - use: frontend

  ci-time-travel:
    config-path: src/config/ci-time-travel.toml
    steps:
      - use: minio
      - use: sqlite
      - use: meta-node
        port: 5690
        dashboard-port: 5691
        exporter-port: 1250
        meta-backend: sqlite
      - use: compactor
      - use: compute-node
      - use: frontend

  ci-session-init:
    config-path: src/config/ci-session-init.toml
    steps:
      - use: meta-node
      - use: compute-node
      - use: frontend

  ci-iceberg-compaction-round:
    config-path: src/config/ci-iceberg-compaction-round.toml
    steps:
      - use: minio
      - use: meta-node
        id: meta-node-iceberg-round
      - use: compute-node
        id: compute-node-iceberg-round
      - use: frontend
        id: frontend-iceberg-round
      - use: compactor
        id: compactor-hummock-round
      - use: compactor
        id: compactor-iceberg-round
        compactor-mode: "dedicated-iceberg"
        compaction-worker-threads-number: 1
        port: 6661
        exporter-port: 1261

  ci-iceberg-test:
    config-path: src/config/ci.toml
    steps:
      - use: minio
      - use: moto
        address: moto
        port: 5000
        user-managed: true
      - use: mysql
        port: 3306
        address: mysql
        user: root
        password: 123456
        user-managed: true
      - use: postgres
        port: 5432
        address: db
        database: metadata
        user: postgres
        password: post\tgres
        user-managed: true
        application: metastore
      - use: meta-node
        meta-backend: postgres
      - use: compute-node
      - use: frontend
      - use: compactor
      - use: compactor
        compactor-mode: "dedicated-iceberg"
        port: 6661
        exporter-port: 1261
      - use: lakekeeper
        port: 8181

  iceberg-glue:
    steps:
      - use: minio
      - use: moto

  meta-1cn-1fe-sqlite-with-recovery:
    config-path: src/config/ci-recovery.toml
    steps:
      - use: minio
