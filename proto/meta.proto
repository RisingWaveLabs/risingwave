message RecoverRequest {}

message RecoverResponse {}

message AlterConnectorPropsRequest {
  message AlterIcebergTableIds {
    uint32 source_id = 1;
    uint32 sink_id = 2;
  }
  enum AlterConnectorPropsObject {
    UNSPECIFIED = 0;
    SOURCE = 1;
    SINK = 2;
    CONNECTION = 3;
    ICEBERG_TABLE = 4;
  }

  uint32 object_id = 1;
  map<string, string> changed_props = 2;
  map<string, secret.SecretRef> changed_secret_refs = 3;
  optional uint32 connector_conn_ref = 4;
  AlterConnectorPropsObject object_type = 5;
  oneof extra_options {
    AlterIcebergTableIds alter_iceberg_table_ids = 6;
  }
}

message AlterConnectorPropsResponse {}

// Options for controlling the safe property update workflow
message PropertyUpdateOptions {
  // If true, reset split assignments after updating properties
  // This causes splits to be re-discovered from upstream
  bool reset_splits = 1;
}

// Request for orchestrated source property update with pause/resume
message AlterSourcePropertiesSafeRequest {
  uint32 source_id = 1;
  map<string, string> changed_props = 2;
  map<string, secret.SecretRef> changed_secret_refs = 3;
  PropertyUpdateOptions options = 4;
}

message AlterSourcePropertiesSafeResponse {}

// Request to reset source split assignments (UNSAFE - admin only)
message ResetSourceSplitsRequest {
  uint32 source_id = 1;
}

message ResetSourceSplitsResponse {}

// Request to inject specific offsets into source splits (UNSAFE - admin only)
message InjectSourceOffsetsRequest {
  uint32 source_id = 1;
  // Split ID -> offset (JSON-encoded based on connector type)
  map<string, string> split_offsets = 2;
}

message InjectSourceOffsetsResponse {
  repeated string applied_split_ids = 1;
}

message ListCdcProgressRequest {}

message ListCdcProgressResponse {
  message CdcProgress {
    uint64 split_total_count = 1;
    uint64 split_backfilled_count = 2;
    uint64 split_completed_count = 3;
    // Only set for non-parallelized CDC backfill.
    optional uint64 backfilled_row_count = 4;
    // Best-effort estimate from upstream database statistics. Only set for
    // non-parallelized CDC backfill when the estimate is available.
    optional uint64 estimated_row_count = 5;
  }
  map<uint32, CdcProgress> cdc_progress = 1;
}

message ListRefreshTableStatesRequest {}

message ListRefreshTableStatesResponse {
  message RefreshTableState {
    uint32 table_id = 1;
    string current_status = 2;
    optional string last_trigger_time = 3;
    optional int64 trigger_interval_secs = 4;
    optional string last_success_time = 5;
  }
  repeated RefreshTableState states = 1;
}

message ListIcebergCompactionStatusRequest {}

message ListIcebergCompactionStatusResponse {
  message IcebergCompactionStatus {
    uint32 sink_id = 1;
    string task_type = 2;
    uint64 trigger_interval_sec = 3;
    uint64 trigger_snapshot_count = 4;
    string schedule_state = 5;
    optional uint64 next_compaction_after_sec = 6;
    // V1 approximates pending snapshot backlog with in-memory sink commit backlog.
    optional uint64 pending_snapshot_count = 7;
    bool is_triggerable = 8;
  }
  repeated IcebergCompactionStatus statuses = 1;
}

service StreamManagerService {
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc CancelCreatingJobs(CancelCreatingJobsRequest) returns (CancelCreatingJobsResponse);
  rpc ListTableFragments(ListTableFragmentsRequest) returns (ListTableFragmentsResponse);
  rpc ListStreamingJobStates(ListStreamingJobStatesRequest) returns (ListStreamingJobStatesResponse);
  rpc ListFragmentDistribution(ListFragmentDistributionRequest) returns (ListFragmentDistributionResponse);
  rpc ListCreatingFragmentDistribution(ListCreatingFragmentDistributionRequest) returns (ListCreatingFragmentDistributionResponse);
  rpc ListSinkLogStoreTables(ListSinkLogStoreTablesRequest) returns (ListSinkLogStoreTablesResponse);
  rpc ListActorStates(ListActorStatesRequest) returns (ListActorStatesResponse);
  rpc ListActorSplits(ListActorSplitsRequest) returns (ListActorSplitsResponse);
  rpc ApplyThrottle(ApplyThrottleRequest) returns (ApplyThrottleResponse);
  rpc Recover(RecoverRequest) returns (RecoverResponse);
  rpc ListRateLimits(ListRateLimitsRequest) returns (ListRateLimitsResponse);
  rpc AlterConnectorProps(AlterConnectorPropsRequest) returns (AlterConnectorPropsResponse);
  rpc AlterSourcePropertiesSafe(AlterSourcePropertiesSafeRequest) returns (AlterSourcePropertiesSafeResponse);
  rpc ResetSourceSplits(ResetSourceSplitsRequest) returns (ResetSourceSplitsResponse);
  rpc InjectSourceOffsets(InjectSourceOffsetsRequest) returns (InjectSourceOffsetsResponse);
  rpc GetFragmentById(GetFragmentByIdRequest) returns (GetFragmentByIdResponse);
  rpc GetFragmentVnodes(GetFragmentVnodesRequest) returns (GetFragmentVnodesResponse);
  rpc GetActorVnodes(GetActorVnodesRequest) returns (GetActorVnodesResponse);
  rpc SetSyncLogStoreAligned(SetSyncLogStoreAlignedRequest) returns (SetSyncLogStoreAlignedResponse);
  rpc ListCdcProgress(ListCdcProgressRequest) returns (ListCdcProgressResponse);
  rpc ListUnmigratedTables(ListUnmigratedTablesRequest) returns (ListUnmigratedTablesResponse);
  rpc ListRefreshTableStates(ListRefreshTableStatesRequest) returns (ListRefreshTableStatesResponse);
  rpc ListIcebergCompactionStatus(ListIcebergCompactionStatusRequest) returns (ListIcebergCompactionStatusResponse);
}

