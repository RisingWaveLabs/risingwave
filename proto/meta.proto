    uint64 actor_count = 1;
    uint64 parallelism = 2;
  }
  map<uint32, WorkerActorCount> worker_id_to_actor_count = 1;
  uint64 hard_limit = 2;
  uint64 soft_limit = 3;
}

message ClusterLimit {
