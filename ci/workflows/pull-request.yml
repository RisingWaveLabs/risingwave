anchors:
  - auto-retry: &auto-retry
      automatic:
        # Agent terminated because the AWS EC2 spot instance killed by AWS.
        - signal_reason: agent_stop
          limit: 3
        - exit_status: -1
          signal_reason: none
          limit: 3
  - plugins:
    - cargo-cache: &cargo-cache
        nienbo/cache#v2.4.21:
          id: cargo
          key: "v1-cache-cargo-{{ runner.os }}-{{ checksum 'Cargo.lock' }}"
          restore-keys:
            - "v1-cache-cargo-{{ runner.os }}-"
            - "v1-cache-cargo-"
          backend: s3
          s3:
            bucket: rw-ci-cache-bucket
            args: "--no-progress"
          paths:
            - ".cargo/registry/index"
            - ".cargo/registry/cache"
            - ".cargo/git"
    - maven-cache: &maven-cache
        nienbo/cache#v2.4.21:
          id: maven
          key: >-
            v1-cache-maven-{{ runner.os }}-{{ checksum 'ci/scripts/build-other.sh' }}-{{ checksum 'java/pom.xml' }}-{{ checksum 'e2e_test/udf/remote_java/pom.xml' }}
          restore-keys:
            - "v1-cache-maven-{{ runner.os }}-"
            - "v1-cache-maven-"
          backend: s3
          s3:
            bucket: rw-ci-cache-bucket
            args: "--no-progress"
          paths:
            - ".m2/repository"
    # we need to override args, so didn't include image here in the anchor
    - docker-compose: &docker-compose
        run: rw-build-env
        config: ci/docker-compose.yml
        mount-buildkite-agent: true
        propagate-environment: true
        upload-container-logs: always

# Shared config for the meta-store-backend (postgres/mysql) e2e steps.
# The serial e2e suite is meta-store-backend agnostic, so shard it across parallel jobs
# (sqllogictest auto-partitions by Buildkite parallel job config). Without sharding the
# un-sharded suite chronically runs ~60min and trips the timeout. `parallelism` and `matrix`
# can't coexist on a single step, so each backend is its own explicit step instead of a matrix.
e2e-other-backend: &e2e-other-backend
  command: "ci/scripts/e2e-test-serial.sh -p ci-dev -m ci-3streaming-2serving-3fe"
  if: build.pull_request.labels includes "ci/run-e2e-test-other-backends" || build.env("CI_STEPS") =~ /(^|,)e2e-test-other-backends?(,|$$)/
  depends_on:
    - "build"
  plugins:
    - docker-compose#v5.5.0:
        <<: *docker-compose
        run: ci-standard-env
        propagate-environment: true
    - ./ci/plugins/upload-failure-logs
  # Headroom over the default e2e step's 35min since the SQL meta store is slower per-op.
  timeout_in_minutes: 45
  parallelism: 4
  retry: *auto-retry


steps:
  - label: "check ci image rebuild"
    plugins:
      - monorepo-diff#v1.2.0:
          diff: "git diff --name-only origin/main"
          watch:
            - path: "ci/.env"
              config:
                command: "ci/build-ci-image.sh"
                label: "ci build images"
            - path: "ci/build-ci-image.sh"
              config:
                command: "ci/build-ci-image.sh"
                label: "ci build images"
  - wait

  - label: "build"
    command: "ci/scripts/build.sh -p ci-dev"
    key: "build"
    plugins:
      - *cargo-cache
      - docker-compose#v5.5.0: *docker-compose
    timeout_in_minutes: 15
    retry: *auto-retry

  - label: "build other components"
    command: "ci/scripts/build-other.sh"
    key: "build-other"
    plugins:
      - *cargo-cache
      - *maven-cache
      - seek-oss/aws-sm#v2.3.2:
          env:
            GITHUB_TOKEN: github-token
      - docker-compose#v5.5.0:
          <<: *docker-compose
          environment:
          - GITHUB_TOKEN
    timeout_in_minutes: 20
    retry: *auto-retry

  - label: "build (deterministic simulation)"
    command: "ci/scripts/build-simulation.sh"
    key: "build-simulation"
    plugins:
      - *cargo-cache
      - docker-compose#v5.5.0: *docker-compose
    retry: *auto-retry

  - label: "docslt"
    command: "ci/scripts/docslt.sh"
    key: "docslt"
    plugins:
      - *cargo-cache
      - docker-compose#v5.5.0: *docker-compose
    timeout_in_minutes: 10
    retry: *auto-retry

  - label: "end-to-end test"
    command: "ci/scripts/e2e-test-serial.sh -p ci-dev -m ci-3streaming-2serving-3fe"
    if: |
      !(build.pull_request.labels includes "ci/pr/run-selected") && build.env("CI_STEPS") == null
      || build.pull_request.labels includes "ci/run-e2e-tests"
      || build.env("CI_STEPS") =~ /(^|,)e2e-tests?(,|$$)/
    depends_on:
      - "build"
    plugins:
      - docker-compose#v5.5.0: *docker-compose
      - ./ci/plugins/upload-failure-logs
    timeout_in_minutes: 35
    parallelism: 4
    retry: *auto-retry
  - label: "e2e preload-memory test"
    command: "DEFAULT_ENABLE_MEM_PRELOAD_STATE_TABLE=true ci/scripts/e2e-test-serial.sh -p ci-dev -m ci-3streaming-2serving-3fe"
    if: |
      !(build.pull_request.labels includes "ci/pr/run-selected") && build.env("CI_STEPS") == null
